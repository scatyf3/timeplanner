[project]
name = "timeplanner"
version = "0.1.0"
description = "辅助式时间规划 agent —— 读笔记/AW/天气，出 plan 草案，你确认才写日历"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
]

[project.optional-dependencies]
# agent loop 走订阅额度（Claude Agent SDK）。只读 summary 不需要它。
agent = ["claude-agent-sdk>=0.1.0"]
# 交互式终端仪表盘（`timeplanner tui`）。Textual 基于 rich，只读 summary 不需要它。
tui = ["textual>=0.60"]
# 浮动条 softbar（`timeplanner softbar`），Mac / Windows 通用。
# 6.9+ 的 Qt 需要 macOS 14.4+；6.8 支持 Python 3.13，对系统版本要求最低。
softbar = ["PySide6>=6.8,<6.9"]

[project.scripts]
timeplanner = "timeplanner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["timeplanner*"]
